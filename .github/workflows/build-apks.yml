name: Build OmniCart Android APKs & AAB Bundles

on:
  push:
    branches:
      - main
      - app-shopper
      - app-partner
      - app-rider
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Production APKs & AABs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Secrets & Keystores
        run: |
          # Ensure .env exists from template if not provided
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          # Decode debug keystore if base64 file exists
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Decode release keystore if base64 file exists
          if [ -f "release.keystore.base64" ] && [ ! -f "release.keystore" ]; then
            base64 -d release.keystore.base64 > release.keystore
          fi

          # Generate fallback release keystore if still not present
          if [ ! -f "release.keystore" ]; then
            keytool -genkeypair -v -keystore release.keystore \
              -alias "omnicart" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "omnicart@2026" \
              -keypass "omnicart@2026" \
              -dname "CN=OmniCart, OU=Production, O=OmniCart Technologies, L=Bengaluru, ST=Karnataka, C=IN"
          fi

          # Ensure gradlew and wrapper jar exist
          if [ ! -f "gradlew" ]; then
            curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          fi

          chmod +x gradlew

      - name: Build All Production Ecosystem Binaries (Main Branch)
        if: github.ref == 'refs/heads/main'
        run: |
          ./gradlew \
            :app:assembleShopperRelease :app:assemblePartnerRelease :app:assembleRiderRelease :app:assembleUnifiedRelease \
            :app:bundleShopperRelease :app:bundlePartnerRelease :app:bundleRiderRelease :app:bundleUnifiedRelease \
            :app:assembleShopperDebug :app:assemblePartnerDebug :app:assembleRiderDebug :app:assembleUnifiedDebug \
            --stacktrace

          mkdir -p artifacts

          # 1. Production Signed Release APKs
          find app/build/outputs/apk/shopper/release -name "*.apk" -exec cp {} artifacts/OmniCart_Shopper_Release.apk \; 2>/dev/null || true
          find app/build/outputs/apk/partner/release -name "*.apk" -exec cp {} artifacts/OmniCart_Partner_Release.apk \; 2>/dev/null || true
          find app/build/outputs/apk/rider/release -name "*.apk" -exec cp {} artifacts/OmniCart_Rider_Release.apk \; 2>/dev/null || true
          find app/build/outputs/apk/unified/release -name "*.apk" -exec cp {} artifacts/OmniCart_Unified_Release.apk \; 2>/dev/null || true

          # 2. Production Signed Play Store AAB Bundles
          find app/build/outputs/bundle/shopperRelease -name "*.aab" -exec cp {} artifacts/OmniCart_Shopper_Release.aab \; 2>/dev/null || true
          find app/build/outputs/bundle/partnerRelease -name "*.aab" -exec cp {} artifacts/OmniCart_Partner_Release.aab \; 2>/dev/null || true
          find app/build/outputs/bundle/riderRelease -name "*.aab" -exec cp {} artifacts/OmniCart_Rider_Release.aab \; 2>/dev/null || true
          find app/build/outputs/bundle/unifiedRelease -name "*.aab" -exec cp {} artifacts/OmniCart_Unified_Release.aab \; 2>/dev/null || true

          # 3. Debug APKs
          find app/build/outputs/apk/shopper/debug -name "*.apk" -exec cp {} artifacts/OmniCart_Shopper_Debug.apk \; 2>/dev/null || true
          find app/build/outputs/apk/partner/debug -name "*.apk" -exec cp {} artifacts/OmniCart_Partner_Debug.apk \; 2>/dev/null || true
          find app/build/outputs/apk/rider/debug -name "*.apk" -exec cp {} artifacts/OmniCart_Rider_Debug.apk \; 2>/dev/null || true
          find app/build/outputs/apk/unified/debug -name "*.apk" -exec cp {} artifacts/OmniCart_Unified_Debug.apk \; 2>/dev/null || true

      - name: Build Standalone Binaries (Dedicated Branch)
        if: github.ref != 'refs/heads/main'
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleDebug --stacktrace
          mkdir -p artifacts
          BRANCH_NAME="${GITHUB_REF_NAME:-standalone}"

          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "artifacts/OmniCart_${BRANCH_NAME}_Release.apk" \; 2>/dev/null || true
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} "artifacts/OmniCart_${BRANCH_NAME}_Release.aab" \; 2>/dev/null || true
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} "artifacts/OmniCart_${BRANCH_NAME}_Debug.apk" \; 2>/dev/null || true

      - name: Verify Generated Artifacts
        run: |
          echo "=================================================="
          echo "📦 Compiled APK & AAB Production Artifacts:"
          ls -lh artifacts/
          echo "=================================================="

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: omnicart-artifacts-${{ github.ref_name }}
          path: artifacts/*
          retention-days: 30
